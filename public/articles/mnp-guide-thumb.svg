<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111111"/>
      <stop offset="60%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#2a0000"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="100%" r="60%">
      <stop offset="0%" style="stop-color:#CC0000;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#CC0000;stop-opacity:0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Decorative grid lines -->
  <line x1="0" y1="100" x2="1200" y2="100" stroke="white" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="0" y1="200" x2="1200" y2="200" stroke="white" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="0" y1="300" x2="1200" y2="300" stroke="white" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="0" y1="400" x2="1200" y2="400" stroke="white" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="0" y1="500" x2="1200" y2="500" stroke="white" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="630" stroke="white" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="630" stroke="white" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="white" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="630" stroke="white" stroke-opacity="0.04" stroke-width="1"/>
  <line x1="1000" y1="0" x2="1000" y2="630" stroke="white" stroke-opacity="0.04" stroke-width="1"/>

  <!-- R badge -->
  <rect x="72" y="60" width="44" height="44" rx="8" fill="#CC0000"/>
  <text x="94" y="89" text-anchor="middle" fill="white" font-size="22" font-weight="900">R</text>

  <!-- Label: 楽天従業員紹介 限定 -->
  <rect x="128" y="66" width="260" height="32" rx="16" fill="white" fill-opacity="0.07" stroke="white" stroke-opacity="0.15" stroke-width="1"/>
  <text x="258" y="88" text-anchor="middle" fill="white" fill-opacity="0.6" font-size="13" font-weight="700" letter-spacing="2">楽天従業員紹介 限定</text>

  <!-- Main headline -->
  <text x="72" y="200" fill="white" font-size="54" font-weight="900" letter-spacing="-1">MNP乗り換えで</text>

  <!-- Big point number -->
  <text x="72" y="330" fill="#CC0000" font-size="120" font-weight="900" letter-spacing="-3">14,000</text>
  <text x="620" y="330" fill="white" font-size="60" font-weight="900" fill-opacity="0.8">P 還元</text>

  <!-- Sub info -->
  <text x="72" y="390" fill="white" fill-opacity="0.5" font-size="22">新規申し込みの方は 11,000P｜従業員紹介コード：2162</text>

  <!-- Divider -->
  <line x1="72" y1="430" x2="560" y2="430" stroke="white" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Author -->
  <circle cx="92" cy="480" r="28" fill="#CC0000" fill-opacity="0.2" stroke="#CC0000" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="92" y="487" text-anchor="middle" fill="#CC0000" font-size="16" font-weight="900">T</text>
  <text x="134" y="474" fill="white" fill-opacity="0.8" font-size="16" font-weight="700">totti</text>
  <text x="134" y="496" fill="white" fill-opacity="0.4" font-size="13">楽天グループ社員 · 30歳</text>

  <!-- Right side decorative card -->
  <rect x="800" y="140" width="320" height="340" rx="20" fill="white" fill-opacity="0.04" stroke="white" stroke-opacity="0.1" stroke-width="1"/>

  <!-- Card content: 3 steps -->
  <text x="960" y="185" text-anchor="middle" fill="white" fill-opacity="0.4" font-size="11" font-weight="700" letter-spacing="3">STEP</text>

  <circle cx="830" cy="240" r="18" fill="#CC0000"/>
  <text x="830" y="246" text-anchor="middle" fill="white" font-size="13" font-weight="900">01</text>
  <text x="858" y="237" fill="white" fill-opacity="0.8" font-size="14" font-weight="700">紹介リンクから申し込む</text>
  <text x="858" y="256" fill="white" fill-opacity="0.4" font-size="12">楽天IDでログイン</text>

  <line x1="830" y1="262" x2="830" y2="290" stroke="white" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="4,3"/>

  <circle cx="830" cy="308" r="18" fill="#CC0000"/>
  <text x="830" y="314" text-anchor="middle" fill="white" font-size="13" font-weight="900">02</text>
  <text x="858" y="305" fill="white" fill-opacity="0.8" font-size="14" font-weight="700">プランの利用を開始</text>
  <text x="858" y="324" fill="white" fill-opacity="0.4" font-size="12">SIM/eSIM 開通</text>

  <line x1="830" y1="330" x2="830" y2="358" stroke="white" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="4,3"/>

  <circle cx="830" cy="376" r="18" fill="#CC0000"/>
  <text x="830" y="382" text-anchor="middle" fill="white" font-size="13" font-weight="900">03</text>
  <text x="858" y="373" fill="white" fill-opacity="0.8" font-size="14" font-weight="700">Rakuten Linkで通話</text>
  <text x="858" y="392" fill="white" fill-opacity="0.4" font-size="12">10秒以上の発信</text>

  <!-- Deadline badge -->
  <rect x="820" y="420" width="280" height="40" rx="20" fill="#CC0000" fill-opacity="0.15" stroke="#CC0000" stroke-opacity="0.3" stroke-width="1"/>
  <text x="960" y="446" text-anchor="middle" fill="#CC0000" font-size="13" font-weight="700">翌々月末日 23:59 までに完了</text>

  <!-- Bottom bar -->
  <rect x="0" y="590" width="1200" height="40" fill="white" fill-opacity="0.03"/>
  <text x="72" y="616" fill="white" fill-opacity="0.25" font-size="12">r10.to/hkhSbQ · 期間限定ポイント · 有効期限6ヶ月</text>
  <text x="1128" y="616" text-anchor="end" fill="white" fill-opacity="0.25" font-size="12">2026</text>
</svg>
