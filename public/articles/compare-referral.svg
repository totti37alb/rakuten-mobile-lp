<svg width="900" height="360" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans JP', 'Hiragino Sans', sans-serif">
  <!-- Background -->
  <rect width="900" height="360" rx="20" fill="#FAF7F2"/>

  <!-- Header row -->
  <rect x="0" y="0" width="900" height="60" rx="20" fill="#1a1a1a"/>
  <rect x="0" y="40" width="900" height="20" fill="#1a1a1a"/>

  <!-- Column labels -->
  <text x="230" y="38" text-anchor="middle" fill="white" fill-opacity="0.5" font-size="13" font-weight="700">友達紹介</text>
  <text x="600" y="38" text-anchor="middle" fill="white" font-size="14" font-weight="900">従業員紹介（コード：2162）</text>

  <!-- Header item label col -->
  <text x="100" y="38" text-anchor="middle" fill="white" fill-opacity="0.4" font-size="12" font-weight="700" letter-spacing="1">比較項目</text>

  <!-- Divider verticals -->
  <line x1="380" y1="60" x2="380" y2="360" stroke="#E5DDD0" stroke-width="1"/>
  <line x1="760" y1="0" x2="760" y2="360" stroke="#CC0000" stroke-opacity="0.2" stroke-width="2"/>

  <!-- Column highlight for 従業員紹介 -->
  <rect x="761" y="60" width="139" height="300" fill="#CC0000" fill-opacity="0.04"/>

  <!-- Row 1: MNP -->
  <rect x="0" y="100" width="900" height="1" fill="#E5DDD0"/>
  <text x="190" y="90" text-anchor="middle" fill="#555" font-size="13">MNP乗り換え還元P</text>
  <text x="570" y="90" text-anchor="middle" fill="#999" font-size="16" font-weight="700" text-decoration="line-through">13,000P</text>
  <text x="830" y="84" text-anchor="middle" fill="#CC0000" font-size="22" font-weight="900">14,000P</text>

  <!-- Row 2: 新規 -->
  <rect x="0" y="140" width="900" height="1" fill="#E5DDD0"/>
  <text x="190" y="128" text-anchor="middle" fill="#555" font-size="13">新規申し込み還元P</text>
  <text x="570" y="128" text-anchor="middle" fill="#999" font-size="16" font-weight="700" text-decoration="line-through">10,000P</text>
  <text x="830" y="122" text-anchor="middle" fill="#CC0000" font-size="22" font-weight="900">11,000P</text>

  <!-- Row 3: 2回線目 -->
  <rect x="0" y="180" width="900" height="1" fill="#E5DDD0"/>
  <text x="190" y="168" text-anchor="middle" fill="#555" font-size="13">2回線目・再契約</text>
  <text x="570" y="168" text-anchor="middle" fill="#CC0000" font-size="20" font-weight="900">✗</text>
  <text x="830" y="165" text-anchor="middle" fill="#16a34a" font-size="20" font-weight="900">✓ 対象</text>

  <!-- Row 4: 過去契約 -->
  <rect x="0" y="220" width="900" height="1" fill="#E5DDD0"/>
  <text x="190" y="208" text-anchor="middle" fill="#555" font-size="13">過去に契約歴あり</text>
  <text x="570" y="208" text-anchor="middle" fill="#CC0000" font-size="20" font-weight="900">✗</text>
  <text x="830" y="205" text-anchor="middle" fill="#16a34a" font-size="20" font-weight="900">✓ 対象</text>

  <!-- Row 5: 上限 -->
  <rect x="0" y="260" width="900" height="1" fill="#E5DDD0"/>
  <text x="190" y="248" text-anchor="middle" fill="#555" font-size="13">適用上限</text>
  <text x="570" y="248" text-anchor="middle" fill="#999" font-size="15" font-weight="700">1回線</text>
  <text x="830" y="245" text-anchor="middle" fill="#CC0000" font-size="16" font-weight="900">最大5回線</text>

  <!-- Row 6: コード -->
  <rect x="0" y="300" width="900" height="1" fill="#E5DDD0"/>
  <text x="190" y="288" text-anchor="middle" fill="#555" font-size="13">キャンペーンコード</text>
  <text x="570" y="288" text-anchor="middle" fill="#999" font-size="14">なし</text>
  <text x="830" y="285" text-anchor="middle" fill="#1a1a1a" font-size="16" font-weight="900">2162</text>

  <!-- Bottom caption -->
  <text x="450" y="340" text-anchor="middle" fill="#C0A890" font-size="11">※ 2026年6月時点の情報。最新の条件は楽天モバイル公式キャンペーンページでご確認ください。</text>
</svg>
